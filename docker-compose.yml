services:
  botrucho:
    build:
      context: .
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: jonathanstrf/botrucho:${VERSION:-latest}
    container_name: botrucho
    ports:
      - '${BOT_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      - DOTENV_PRIVATE_KEY_PRODUCTION=${DOTENV_PRIVATE_KEY_PRODUCTION}
      - SHARDS=${SHARDS:-1}
    restart: unless-stopped
    mem_limit: 700m
    memswap_limit: 700m
    cpus: 0.5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    dns: 8.8.8.8
    init: true
